# Baseline: 83.40% line coverage on 2026-10-02, all targets/all features.
# Codecov is the sole coverage dashboard. Qlty handles static quality only.
codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: auto
        threshold: 2%
        informational: true
    patch:
      default:
        target: 80%
        informational: true
    changes: false

# CI generates lcov format (cargo llvm-cov --lcov); no gcov parser needed.
comment: false

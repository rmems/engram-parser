name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'  # Run daily at midnight

concurrency:
  group: ci-cpu-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      # actions/checkout@v7.0.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # dtolnay/rust-toolchain@stable
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          components: clippy, rustfmt, llvm-tools-preview

      # Swatinem/rust-cache@v2 (adopted from corinth-canal for better caching)
      - name: Cache Cargo + target
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          cache-on-failure: true

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (lint)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-features

      - name: Test
        run: cargo test --all-features

      # Verify build/test leaves no unexpected artifacts (clean-tree guard per qodo review)
      - name: Check working tree is clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "❌ Working tree has unexpected changes after build+test:"
            git status --short
            exit 1
          fi
          echo "✅ Working tree is clean"

      # Coverage using Codecov (per review: "We will use codecov https://about.codecov.io/language/rust/")
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage report
        run: cargo llvm-cov --all-targets --all-features --locked --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false
          verbose: true

  msrv:
    name: MSRV (1.97.1)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Override repo `rust-toolchain.toml` (channel=stable) so this job truly
    # exercises MSRV, not latest stable.
    env:
      RUSTUP_TOOLCHAIN: "1.97.1"
    steps:
      # actions/checkout@v7.0.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # dtolnay/rust-toolchain — pin to MSRV (matches Cargo.toml rust-version)
      - name: Install Rust MSRV (1.97.1)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: "1.97.1"
          components: clippy, rustfmt

      # Swatinem/rust-cache@v2
      - name: Cache Cargo + target
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          cache-on-failure: true

      - name: Confirm MSRV toolchain is active
        run: |
          rustc --version | grep -F '1.97.1 '
          cargo --version

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (lint)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-features

      - name: Test
        run: cargo test --all-features

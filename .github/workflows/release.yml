name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published version tag (v0.3.0 for the first release)'
        required: true
        type: string
      ref:
        description: 'Exact published commit SHA'
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify:
    name: Verify publication gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      # actions/checkout@v7.0.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.inputs.ref }}
          persist-credentials: false
          fetch-depth: 0

      # dtolnay/rust-toolchain@stable
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          components: clippy, rustfmt

      # Swatinem/rust-cache@v2
      - name: Cache Cargo + target
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          shared-key: "release-v2"
          cache-on-failure: false

      - name: Validate version and unpublished tag
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          test "$TAG" = "v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag '$TAG' already exists; tags are created only after this gate"
            exit 1
          fi

      - name: Record verified commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings

      - name: Build and test (default features)
        run: cargo build && cargo test

      - name: Clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build and test (all features)
        run: cargo build --all-features --release && cargo test --all-features --release

      - name: Build rustdoc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --all-features --no-deps

      - name: Inspect package contents
        run: cargo package --list

      - name: Build package
        run: cargo package --locked

      - name: Verify crates.io publication
        run: cargo publish --dry-run --locked

  release:
    name: Tag published commit and create GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # actions/checkout@v7.0.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: true
          fetch-depth: 0

      - name: Create and push tag
        env:
          TAG: ${{ github.event.inputs.tag }}
        run: |
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }}
          draft: false
          prerelease: ${{ contains(github.event.inputs.tag, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Qlty handles workflow linting and maintainability analysis. Rust fmt/clippy
# remain authoritative in CI; Codecov is the sole coverage reporting service.
config_version = "0"

exclude_patterns = [
  "**/target/**",
  "**/.worktrees/**",
]

test_patterns = [
  "tests/**",
  "src/**/tests.rs",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true

[[plugin]]
name = "actionlint"

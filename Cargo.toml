[package]
name = "engram-parser"
version = "0.3.0"
edition = "2024"
rust-version = "1.97.1"
description = "Pure-Rust GGUF + Safetensors checkpoint/tensor substrate: format-independent tensor inventory, metadata, and raw payload access for ANN/SNN research. Default builds are zero-dependency (`fs::read` into `Vec<u8>`). Optional `mmap` feature adds memmap2. Packed dequant for Q8_0/Q5_K/Q6_K/IQ3_M. Off-by-default `safetensors` feature adds manifest/discovery plus raw tensor payload access via the upstream safetensors crate. MoE per-expert weight extraction ships as a GGUF model-analysis specialization."
license = "MIT OR Apache-2.0"
authors = ["Raul Cardenas Montoya <montoyaraul34@gmail.com>"]
repository = "https://github.com/rmems/engram-parser"
homepage = "https://github.com/rmems/engram-parser"
keywords = ["gguf", "safetensors", "checkpoint", "tensor", "parser"]
categories = ["parser-implementations", "science"]
readme = "README.md"
# crates.io publication allowlist (RM-1796): crate source + user-facing examples,
# manifest, README, changelog, and licenses only. Tests, fixtures, docs, CI, and
# dev tooling stay out of the published package.
include = [
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "CHANGELOG.md",
    "LICENSE-MIT",
    "LICENSE-APACHE-2.0",
    "src/**",
    "examples/**",
]

[dependencies]
memmap2 = { version = "0.9.11", optional = true }
safetensors = { version = "0.8.0", optional = true }

[features]
default = []
mmap = ["dep:memmap2"]
safetensors = ["dep:safetensors"]

[[example]]
name = "checkpoint_smoke"
required-features = ["mmap", "safetensors"]
test = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[workspace]

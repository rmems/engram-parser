[package]
name = "engram-parser"
version = "0.2.0"
edition = "2024"
rust-version = "1.97.1"
description = "Pure-Rust GGUF/Safetensors checkpoint parser and Mixture-of-Experts per-expert weight extractor. Default builds are zero-dependency (`fs::read` into `Vec<u8>`). Optional `mmap` feature adds memmap2. Packed dequant for Q8_0/Q5_K/Q6_K/IQ3_M. Off-by-default `safetensors` feature is header/manifest/discovery only (no extra crates)."
license = "MIT OR Apache-2.0"
authors = ["Raul Montoya Cardenas <montoyaraul34@gmail.com>"]
repository = "https://github.com/rmems/engram-parser"
homepage = "https://github.com/rmems/engram-parser"
keywords = ["gguf", "moe", "parser", "weights", "deserializer"]
categories = ["parser-implementations", "science"]
readme = "README.md"

[dependencies]
memmap2 = { version = "0.9.11", optional = true }

[features]
default = []
mmap = ["dep:memmap2"]
safetensors = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[workspace]

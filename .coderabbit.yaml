# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit config for rmems/engram-parser. Reviews are advisory.
language: en-US
reviews:
  profile: chill
  request_changes_workflow: false
  fail_commit_status: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - '!**/target/**'
  path_instructions:
    - path: '**/*.rs'
      instructions: >-
        Rust edition 2024; rust-version = "1.97.1" is enforced by a dedicated MSRV
        job; rust-toolchain.toml tracks stable. Do not suggest downgrading the
        edition or using std/language APIs newer than the pinned toolchain/MSRV. CI
        gate: cargo clippy --all-targets --locked -- -D warnings, cargo test
        --locked, plus --all-features builds/tests and the MSRV 1.97.1 job. Flag
        anything that would fail cargo fmt --check or clippy -D warnings. The
        default build is GGUF-only with zero dependencies; mmap and safetensors
        are optional features and must stay behind #[cfg(feature = ...)]. Flag any
        new unsafe outside src/gguf/map.rs, src/safetensors/map.rs, and
        src/safetensors/paths.rs.
    - path: src/{gguf/map.rs,safetensors/**}
      instructions: >-
        Scrutinize every unsafe block (currently in src/gguf/map.rs,
        src/safetensors/map.rs, src/safetensors/paths.rs): require a written
        safety justification covering aliasing, lifetimes, alignment and bounds;
        prefer a safe abstraction when one exists. For memory maps, document that
        the file must not be truncated or mutated while mapped, and validate header
        offsets/lengths before slicing.
    - path: '**/Cargo.toml'
      instructions: >-
        Cargo manifest. Call out new dependencies and feature changes, and keep
        rust-version / edition consistent with CI. Default features must stay
        empty (zero-dependency GGUF parser).
    - path: tests/fixtures/**
      instructions: >-
        Small binary fixtures (.safetensors) used by the parser tests; changes
        must be explained by a parser change.
    - path: '**/Dockerfile'
      instructions: >-
        Dockerfile. Keep secrets out of layers and build args, and keep toolchain
        versions in line with the CI pins.
    - path: .github/workflows/**
      instructions: >-
        GitHub Actions workflows. Keep permissions: least-privilege and job
        commands in sync with the local gates documented in the repo. Every uses:
        is pinned to a full commit SHA today; new or bumped actions must be too.
  tools:
    clippy:
      enabled: true
    shellcheck:
      enabled: true
    hadolint:
      enabled: true
    actionlint:
      enabled: true
    yamllint:
      enabled: true
    markdownlint:
      enabled: true
    biome:
      enabled: false
